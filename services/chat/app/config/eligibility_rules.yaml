# In-principle eligibility — Customer Service workbook, Sheet
# "5. In Principle Eligibility". TWO TIERS (brief §4.4).
#
# Tier 1: the six self-declared inputs the bot checks live. These thresholds
# are consumed by agents/eligibility/rules.py — a PURE, deterministic function.
# The LLM extracts the slots and phrases the explanation; it NEVER decides
# (brief §12). Thresholds live here, never in .py.
#
# Tier 2: explicitly NOT done by the bot (needs documents/bureau data). Any of
# these topics -> route to sales_handoff, never attempt. Listed for the
# narrative + for keyword detection of a "Tier-2 signal".

rule_version: eligibility_v1

disclaimer: >-
  This is an indicative pre-check based on what you've told me — not an approval,
  an offer, or a credit decision. A final decision is made by our SME financing
  team after a full review of your documents.

# Next-step buttons shown after an indicative verdict (frontend `eligResult`
# step). `key` = the action the widget dispatches back; `label` = button text.
# Content only — no logic. Adapter maps each key (see docs/FRONTEND_ALIGNMENT.md).
result_actions:
  eligible:
    - { key: "apply:start",           label: "Start my application" }
    - { key: "handoff:sales",         label: "Talk to our SME team" }
  not_eligible:
    - { key: "handoff:sales",         label: "Talk to our SME team" }
    - { key: "guidelines:requirements", label: "See the requirements" }

# ── Tier 1 — bot checks these (Sheet 5, upper table) ─────────────────────────
# Each rule: key (slot name), label, min, max. `max` may be:
#   null                      -> no upper bound
#   {pct_of: <key>, pct: x}   -> upper bound = x * value(other slot)
#
# `options` are quick-reply answers the client shows as clickable chips (the user
# can still type a custom answer). They're plain values that extract exactly like
# a typed reply — deliberately spanning below AND above the threshold so both
# pass and fail paths are reachable.
tier1:
  - id: "5.1-1"
    key: business_age_years
    label: Age of business
    unit: years
    min: 3
    max: null
    prompt: "How many years has your business been operating?"
    options: ["<1 year", "1-3 years", "3-5 years", "5+ years"]

  - id: "5.1-2"
    key: total_equity_or_net_worth
    label: Total equity OR net worth
    unit: RM
    min: 0
    max: null
    prompt: "What's your business's total equity or net worth, in RM?"
    options: ["RM 50k", "RM 200k", "RM 500k", "RM 1m"]

  - id: "5.1-3"
    key: revenue
    label: Revenue OR turnover OR sales
    unit: RM
    min: 0
    max: null
    prompt: "Roughly what's your annual revenue or turnover, in RM?"
    options: ["RM 100k", "RM 500k", "RM 1m", "RM 5m"]

  - id: "5.1-5"
    key: end_balance
    label: Average 6-month bank end balance
    unit: RM
    min: 0
    max: null
    prompt: "What's your average bank end balance over the last 6 months, in RM?"
    options: ["RM 20k", "RM 100k", "RM 300k", "RM 1m"]

  - id: "5.1-6"
    key: staff_count
    label: No. of staff
    unit: people
    min: 5
    max: null
    prompt: "How many staff does your business currently employ?"
    options: ["1-2", "3-5", "6-10", ">10"]

# ── Informational — collected alongside Tier-1 but NEVER evaluated. Operating
# profit stays Tier-2 by policy (self-declared figures for it aren't trusted for
# a verdict), so it never gates PASS/FAIL or the working-capital limit below —
# it's carried through to the customer/Sales summary, that's all.
informational:
  - key: operating_profit
    label: Operating profit
    unit: RM
    prompt: "Roughly what's your operating profit, in RM?"

# The working-capital limit is now a COMPUTED OUTPUT (revenue x this pct), shown
# after a completed check — not an input the customer is asked to guess within.
# Mirrors the Node backend's PolicyThresholds.financing.wclRevenuePct default
# (bmmb-sme-financing-platform/frontend/src/utils/financingRatios.ts); duplicated
# here since this service has no wiring to that policy endpoint.
working_capital_limit_pct: 0.30

# ── Tier 2 — NOT attempted by the bot (Sheet 5, lower table) ─────────────────
# If the customer's message raises any of these, the bot routes to Sales (T4),
# it does not evaluate them.
tier2_topics:
  - Advances to director or related company
  - Dishonour cheque
  - Insolvency
  - Connected party
  - AMLA — sanction / adverse news / PEC screening
  - CTOS — legal case & SSM/IC cross-checks
  - CCRIS / CBM — PD score & MIA
  - Debt Service Coverage Ratio (audited / bank statement / gross income)
  - Gearing ratio

# Lowercase substrings used by the eligibility agent to detect a Tier-2 signal
# and hand off instead of attempting the check.
tier2_keywords:
  - advances to director
  - dishonour
  - dishonoured cheque
  - insolvency
  - bankrupt
  - connected party
  - amla
  - sanction
  - adverse news
  - politically exposed
  - ctos
  - ccris
  - cbm
  - pd score
  - mia
  - dscr
  - debt service
  - gearing
