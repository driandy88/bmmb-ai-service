# Reroute to Sales — Customer Service workbook, Sheet
# "2. Reroute to Sales". Handoff triggers (2.1), handoff message templates
# (H1–H4), geo→region lookup, and the Sales directory (2.2 & 2.3).
#
# Consumed by agents/sales_handoff. Geo resolution: a customer's state OR city
# -> region_id -> the region's contact. Unresolvable location -> fallback R1.

# ── 2.1 Handoff trigger criteria ─────────────────────────────────────────────
triggers:
  - { id: T1, name: "Complaint / dispute",              condition: "Grievance about service, staff, or a decision.", route_to: "SME Sales Team" }
  - { id: T2, name: "Explicit request for human",       condition: "Customer asks to talk to a person.",             route_to: "SME Sales Team" }
  - { id: T3, name: "Repeated bot failure",             condition: "Unresolved after N turns / low-confidence loop.", route_to: "SME Sales Team" }
  - { id: T4, name: "Sensitive / borderline eligibility", condition: "Manually-reviewable financing case (Sheet 5 Tier-2).", route_to: "SME Sales Team" }

# ── 2.4 Handoff message templates (H1–H4) ────────────────────────────────────
# {branch_contact} filled from the resolved directory entry; {hours} from
# HANDOFF_HOURS.
handoff_messages:
  H1:
    scenario: General handoff
    message: "I'll connect you with our SME financing team who can help further. You can reach them at {branch_contact} during {hours}."
  H2:
    scenario: Complaint
    message: "I'm sorry about this experience. Our team will look into it — please contact {branch_contact} and they'll assist you."
  H3:
    scenario: Identity required
    message: "For your security, this step needs to be done with our team directly. Please reach {branch_contact}."
  H4:
    scenario: Repeated failure
    message: "Let me hand you to someone who can help properly — please contact {branch_contact}."

# Which handoff message each trigger uses.
trigger_message:
  T1: H2
  T2: H1
  T3: H4
  T4: H1

# ── 2.2 & 2.3 Sales directory & contact details ──────────────────────────────
