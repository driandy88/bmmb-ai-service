# Source manifest — one entry per source document.
#
# Stage 1 reads a PDF from data/00_raw/<doc_id>.pdf (or pulls source_uri from
# GCS) and parses it page by page. `page_overrides` records the pages that
# deviate from `default_corpus` — this is where internal credit-filtering pages
# are marked `access_tier: internal` so they never reach the customer channel
# (brief §11), where contact/branch slides are routed to sales_dir, and where
# pure filler (company profile, agenda) is skipped.
#
# Page numbers are 1-based and match the PDF, not the slide caption.

- doc_id: talk_pp_commercial_financing
  title: TALK PP Commercial Financing Solution
  source_uri: gs://bmmb-rag-sources/TALK_PP_COMMERCIAL_FINANCING_SOLUTION.pdf
  default_corpus: program
  version: "2025.1"
  effective_date: 2025-01-01
  expiry_date: 2026-12-31
  lang: en
  page_overrides:
    - pages: [32, 33, 34, 35]
      access_tier: internal        # internal filtering criteria — customer channel must never retrieve these (§11)
    - pages: [37, 38, 39]
      corpus: sales_dir            # contact / branch directory slides
    - pages: [2, 36]
      skip: true                   # company profile / filler — no product content
