  audience: dealer                  # NOT a general SME retail product — route accordingly
  version: "2024.1"
  effective_date: 2024-01-01
  expiry_date: 2025-12-31
  lang: en
  # CORRECTED vs brief §7 (verified against the file — §7c-1):
  #   brief said skip [8..15] + p7 sales_dir + p5,6 indicative.
  #   actual: p5 BLANK; p6,7,8 are REAL content (incl. Required Documents on p8);
  #   p9 is the real dealer contacts; p10-15 are the Studio Shodwe / Lorem-ipsum
  #   Canva template filler. Trusting the brief's numbers would drop required docs
  #   + contacts and index nothing useful.
  page_overrides:
    - pages: [5]
      skip: true                    # blank slide
    - pages: [10, 11, 12, 13, 14, 15]
      skip: true                    # unremoved Canva template filler (Lorem ipsum, fake address)
    - pages: [9]
      corpus: sales_dir             # dealer contacts (Ivan Teoh, Nik Mohd A...)

