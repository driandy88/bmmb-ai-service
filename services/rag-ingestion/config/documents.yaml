# Source manifest — the corpus is now ONE deck (§7, §7b).
#
# Change from Phase 1: instead of five separately-supplied per-program Sales Kit
# PDFs, the whole corpus comes from a SINGLE combined deck — "TALK PP COMMERCIAL
# FINANCING SOLUTION" — where each programme is a SECTION (page range) of the one
# file. So every entry below shares `source_pdf` and `source_uri`, and carves its
# programme out with `include_pages`. The pipeline is unchanged: `source_pdf`
# points every entry at the same on-disk PDF, `include_pages` selects the section,
# and page numbers stay ORIGINAL so the source_uri deep-link (#page=N) resolves
# against the full deck.
#
# Page ranges were VERIFIED against the file's bookmarks AND per-page text
# (39 pages). Local file: data/00_raw/talk_pp_commercial_financing.pdf
# (md5 D5go3K51koMouYvsil6erw==, identical to the GCS object below).
#
# Programme set differs from Phase 1 — this deck covers MHP-i, MIHP-i, the
# Business Credit Card-i (CGC), GGSM (Madani 4) and Biz Jamin (BIZJAMIN); it does
# NOT contain SJUM or PROUD, which therefore leave the index. GGSM keeps its
# `GGSM` code even though the deck is "Madani 4" (was Madani 3) — retrieval
# continuity; update products.yaml's GGSM label + corpora.yaml `programs` to match.

# ── Program corpus — the programmes, each a section of the one deck ──────────

