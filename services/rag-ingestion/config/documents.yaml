# Source manifest — ONE entry per program document (brief §7, §7b).
# One deck = one program = one independently versioned document. That is what
# makes the annual refresh a single-document operation (§7b): re-run one doc_id,
# re-embed one doc's pages, never rebuild the corpus.
#
# Local files live at data/00_raw/<doc_id>.pdf (or `source_pdf` if the on-disk
# name differs). `source_uri` is the authoritative GCS location + becomes the
# chunk deep-link. Page numbers are 1-based and match the PDF.
#
# Page numbers below were VERIFIED against the supplied Sales Kits (§7c). Where
# the brief's example numbers disagreed with the actual file (PROUD), the file
# wins and the discrepancy is noted inline.

