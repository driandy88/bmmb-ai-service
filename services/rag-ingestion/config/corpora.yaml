# Corpus definitions + defaults. One physical store (rag_chunks); the `corpus`
# column is the hard retrieval boundary (brief §3, §11). Keep these three names
# in sync with the chat service's Corpus enum
# (services/chat/app/agents/rag/retriever.py).

corpora:
  program:
    description: Per-program Sales Kits — the financing programs (§7).
    default_access_tier: customer
    # The five Sales Kits supplied for Phase 1. NOTE the naming: the deck is
    # "Madani 3" -> GGSM3 (not GGSM / GGSM4); align products.yaml + intents.yaml
    # before indexing or product-code retrieval will miss (§7c-5).
    programs: [MIHP-I, MHP-I, GGSM3, SJUM, PROUD]
    # Other programs (AL-IJARAH, CGC, SRF, BIZJAMIN, TERAJU, Business Credit Card-i,
    # GGSM4) exist as brochures/combined-deck slides but are OUT of scope until
    # supplied as their own per-program documents (§7b rule 1).

  guidelines_shariah:
    description: BMMB SME policy, Shariah rulings, prohibited-activity lists.
    default_access_tier: customer
    status: empty      # KNOWN GAP (§12): no source content yet (workbook Sheet 4 empty).
                       # Build the plumbing, leave it empty, report it. Do NOT invent
                       # Shariah content — it requires governance sign-off before indexing.

  sales_dir:
    description: Branch / sales directory — state -> region -> named representative.
    default_access_tier: customer
    note: >-
      Deterministic lookup, not semantic search (§12). Recommend serving from a
      plain SQL table; kept in the corpus enum only for interface consistency.
      Flag before vector-searching it.

# Which corpora a routed intent retrieves from (consumed at Phase 5/6 by the
# chat-side retriever). AMB-05 is the reason the retriever must accept a SET:
# a Shariah-boundary business-type question needs program AND policy context.
intent_corpora:
  INS-01: [sales_dir]
  INS-02: [program]
  INS-03: [guidelines_shariah]
  AMB-05: [program, guidelines_shariah]

# Canonical sections a curated document is reorganised into (Stage 3), in output
# order. Extends the brief's 7 with the §6a program-dependent attributes as their
# OWN sections (financing_rate, margin, guarantee) so a chunk's breadcrumb names
# the exact attribute — the safety net against MHP-i/MIHP-i confusion. `criteria`
# is the internal-tier filtering doc; `other` catches anything unmapped (logged).
sections:
  [overview, eligibility, financing_size, financing_rate, margin, tenure,
   guarantee, purpose, facility, fees, documents, contact, criteria, other]

# Deterministic heading -> canonical-section map (Stage 3). A parsed slide heading
# is lowercased and matched by substring; FIRST section whose keywords hit wins, so
# order = priority (guarantee before fees so "guarantee fee" -> guarantee). Editable
# by BMMB; unmatched headings fall to `other` and are logged, never dropped.
section_keywords:
  overview:        ["hire purchase", "government guarantee scheme", "skim jaminan",
                    "program untuk dealer", "commercial financing solutions", "objective", "focus sector"]
  financing_size:  ["financing size", "financing amount", "financing limit"]
  financing_rate:  ["financing rate", "profit rate", "indicative installment", "installment amount"]
  margin:          ["margin of financing", "margin financing"]
  tenure:          ["tenure", "term of utilisation", "term / revolving"]
  guarantee:       ["guarantee cover", "guarantee coverage", "guarantee fee", "guarantee per customer"]
  eligibility:     ["eligibility", "who is eligible", "sme criteria", "eligible dealers",
                    "classification of motor vehicle", "type of motor vehicle"]
  purpose:         ["purpose of financing", "purpose"]
  documents:       ["what do we need", "what we need", "required documents"]
  fees:            ["stamp duty", "fee"]
  facility:        ["facilit", "application type", "trade facility", "mcash", "floor stocking",
                    "security", "how to enjoy", "campaign"]
  contact:         ["contact us", "sales management team"]
  criteria:        ["filtering", "key areas", "key indicators", "no of years", "no of staff",
                    "pd rating", "permitted business", "gearing", "good conduct", "credit record"]
